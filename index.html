<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cafe Calypso</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ================= NAVIGATION ================= -->

<header>

    <nav>

        <a href="#home">
            <img src="images/home.png" alt="Home">
        </a>

        <a href="https://maps.app.goo.gl/Ba2ABEY7E9izQUxo6" target="_blank">
            <img src="images/nav.png" alt="Navigate">
        </a>

        <a href="#menu">
            <img src="images/menu.png" alt="Menu">
        </a>

        <a href="#story">
            <img src="images/our.png" alt="Our Story">
        </a>

        <a href="#more">
            <img src="images/more.png" alt="More">
        </a>

    </nav>

</header>



<!-- ================= LANDING ================= -->

<section id="home">

    <img src="images/landing.png" class="page">

    <a href="#experience">

        <img src="images/dive.png" class="dive">

    </a>

</section>



<!-- ================= EXPERIENCE ================= -->

<section id="experience">

    <img src="images/page2.png" class="page">

</section>



<!-- ================= GRAND OPENING ================= -->

<section id="opening">

    <img src="images/page3.png" class="page">

</section>



<!-- ================= MENU ================= -->

<section id="menu">

    <img src="images/page4.png" class="page">

</section>



<!-- ================= OUR STORY ================= -->

<section id="story">

    <img src="images/page5.png" class="page">

</section>



<!-- ================= INVITATION ================= -->

<section id="invite">

    <img src="images/page6.png" class="page">
    <a
        href="https://maps.app.goo.gl/Ba2ABEY7E9izQUxo6"
        target="_blank"
        class="map-link">
    </a>

</section>
<section id="more">

    <img src="images/page7.png" class="page">

</section>


</body>

</html>
